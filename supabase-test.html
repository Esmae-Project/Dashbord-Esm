<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>تست اتصال Supabase</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      line-height: 2;
      background: #f5f5f5;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 12px;
      max-width: 800px;
      margin: auto;
    }

    pre {
      direction: ltr;
      text-align: left;
      white-space: pre-wrap;
      background: #f1f1f1;
      padding: 15px;
      border-radius: 8px;
      overflow-x: auto;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>🧪 تست اتصال به Supabase</h2>

  <p id="status">در حال اتصال...</p>

  <pre id="result"></pre>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://tqjkourdfxcdopstqrzp.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_WfWO41Jr6Ix03fa1tv9txg_fQ8Dd3qw";

const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


async function testConnection() {

  const status =
    document.getElementById("status");

  const result =
    document.getElementById("result");


  const { data, error } =
    await db
      .from("transactions")
      .select(`
        id,
        description,
        amount_toman,
        transaction_date,
        status,
        contractors(name),
        projects(name)
      `)
      .order(
        "created_at",
        { ascending: false }
      );


  if (error) {

    status.textContent =
      "❌ اتصال یا دسترسی مشکل دارد";

    result.textContent =
      error.message;

    console.error(error);

    return;
  }


  status.textContent =
    "✅ اتصال موفق بود";

  result.textContent =
    JSON.stringify(
      data,
      null,
      2
    );

}


testConnection();

</script>

</body>
</html>
